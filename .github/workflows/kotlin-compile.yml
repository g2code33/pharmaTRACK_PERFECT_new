name: Shared Kotlin Compilation

# Compiles the Kotlin sources shared by every Android variant (debug AND
# release) on the runner that owns the Android toolchain. Both pull-request
# validation and the release workflow call this, so a Kotlin break is caught
# before any platform packaging starts — not first inside a release job.
#
# AGP chains compile* from preBuild, which syncs the built web app into the
# APK's assets, so the web bundle is built first (npm run build).

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kotlin:
    name: Kotlin sources (debug + release)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      # The committed Gradle wrapper (8.7) is the single source of truth for
      # the build tool version; the setup action also caches dependencies.
      - name: Set up Gradle (wrapper)
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up Android SDK (platform 35)
        uses: ./.github/actions/setup-android-sdk

      - name: Build the web app (embedded into the APK by preBuild)
        run: |
          npm ci
          npm run build

      - name: Compile Kotlin (debug + release variants)
        working-directory: android
        run: ./gradlew --no-daemon :app:compileDebugKotlin :app:compileReleaseKotlin
