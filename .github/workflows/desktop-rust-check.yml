name: 'Verify desktop (Rust) build'

# The Tauri shell can only be compiled on a machine with the WebKitGTK
# toolchain, and until now the first compile of any Rust change happened
# inside the release job on main — i.e. after the change had already been
# merged. This runs the same compiler plus the Rust unit tests on the working
# branch whenever anything under src-tauri changes, so a broken desktop build
# is caught before it can break a release.
on:
  push:
    branches:
      - main
      - arena/01a0e837-pharmatrack-perfect-new
    paths:
      - 'src-tauri/**'
      - '.github/workflows/desktop-rust-check.yml'
  workflow_dispatch:

jobs:
  verify-desktop-rust:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target directory
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-desktop-rust-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-desktop-rust-

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libx11-dev

      # tauri-build embeds the built frontend, so dist/ has to exist before the
      # crate will compile at all.
      - run: npm install --legacy-peer-deps
      - run: npm run build

      - name: Compile the desktop shell
        working-directory: src-tauri
        run: |
          set -o pipefail
          echo "cargo at $(command -v cargo || echo MISSING)"
          if ! cargo check --locked --all-targets 2>&1 | tee /tmp/cargo-check.log; then
            # The runner does not install a rustc problem matcher, so compiler
            # errors would only live in a log this branch cannot always read.
            # Republish error contexts (and a log tail) as annotations. Steps
            # may only emit 10 error + 10 warning annotations, so budget them.
            python3 - <<'EOF'
          import re
          ansi = re.compile(r'\x1b\[[0-9;]*m')
          raw = open('/tmp/cargo-check.log', errors='replace').read().splitlines()
          lines = [ansi.sub('', l) for l in raw]
          errs = [i for i, l in enumerate(lines) if l.startswith('error')]
          print(f'::error::cargo check failed; {len(errs)} error line(s) in {len(lines)} log lines')
          for i in errs[:8]:
              msg = ' | '.join(lines[i:i+6])[:700]
              print('::error::' + msg.replace('%', '%25').replace('\r', '%0D'))
          for l in lines[-10:]:
              print('::warning::TAIL: ' + l[:230].replace('%', '%25').replace('\r', '%0D'))
          EOF
            exit 1
          fi

      - name: Run desktop unit tests
        working-directory: src-tauri
        run: cargo test --locked
