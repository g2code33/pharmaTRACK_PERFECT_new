name: Deploy PharmaTRACK Web to Cloudflare

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Cloudflare environment to deploy
        required: true
        type: choice
        options:
          - staging
          - production
      run_smoke:
        description: Run authenticated upload/retrieval smoke test after deploy
        required: true
        default: true
        type: boolean

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      CLOUDFLARE_API_BASE_URL: ${{ vars.CLOUDFLARE_API_BASE_URL }}
      CLOUDFLARE_TEST_ORIGIN: ${{ vars.CLOUDFLARE_TEST_ORIGIN }}
      CLOUDFLARE_TEST_ACCESS_TOKEN: ${{ secrets.CLOUDFLARE_TEST_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm test -- --reporter=dot
      - run: npm run cf:typecheck
      - run: npm run build

      # This is a publishable Supabase key, but it remains an environment
      # secret so no deployment configuration couples source control to a key.
      - name: Set Worker Supabase publishable key
        shell: bash
        run: |
          test -n "$VITE_SUPABASE_ANON_KEY"
          printf '%s' "$VITE_SUPABASE_ANON_KEY" | npx wrangler secret put SUPABASE_ANON_KEY --env "${{ inputs.environment }}" --config wrangler.toml

      - name: Deploy Worker, Static Assets, and R2 binding
        run: npx wrangler deploy --env "${{ inputs.environment }}" --config wrangler.toml

      - name: Run authenticated Cloudflare smoke test
        if: ${{ inputs.run_smoke }}
        run: |
          test -n "$CLOUDFLARE_API_BASE_URL"
          test -n "$CLOUDFLARE_TEST_ACCESS_TOKEN"
          npm run cf:smoke
