name: 'Build & Release PharmaTRACK'
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Job 1: Build the Windows Version First
  build-windows:
    permissions:
      contents: write
    runs-on: windows-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      win_sig: ${{ steps.win_sig.outputs.sig }}
    env:
      VITE_SUPABASE_URL: '${{ secrets.VITE_SUPABASE_URL }}'
      VITE_SUPABASE_ANON_KEY: '${{ secrets.VITE_SUPABASE_ANON_KEY }}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-pc-windows-msvc }

      - name: Extract Version
        id: get_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - run: npm install --legacy-peer-deps
      - run: npm run build

      # TAURI_SIGNING_PRIVATE_KEY_B64 already holds the exact clean, single-line,
      # base64-wrapped key content (the untouched output of `cat updater_keys`).
      # Pass it straight through as content — do NOT base64-decode it here.
      # Tauri does that decoding internally; doing it twice corrupts the key.
      - name: Build Windows App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          TAURI_SIGNING_PRIVATE_KEY: '${{ secrets.TAURI_SIGNING_PRIVATE_KEY_B64 }}'
        with:
          tagName: v__VERSION__
          releaseName: 'PharmaTRACK v__VERSION__'
          releaseDraft: true
          prerelease: false

      # Read the real Windows signature generated during the build (MSI or NSIS)
      - name: Read Windows Signature
        id: win_sig
        shell: bash
        run: |
          # Pick exactly ONE .sig file (prefer MSI, fall back to NSIS).
          SIG_FILE=$(find src-tauri/target/release/bundle/msi -name "*.sig" 2>/dev/null | head -n 1)
          if [ -z "$SIG_FILE" ]; then
            SIG_FILE=$(find src-tauri/target/release/bundle/nsis -name "*.sig" 2>/dev/null | head -n 1)
          fi
          SIG=$(cat "$SIG_FILE" 2>/dev/null || echo "")

          if [ -z "$SIG" ]; then
            echo "ERROR: No Windows .sig file found — updater signature would be empty." >&2
            exit 1
          fi
          echo "sig=$SIG" >> $GITHUB_OUTPUT

  # Job 2: Build Ubuntu App and Force Upload latest.json Manifest
  build-linux-and-release:
    needs: build-windows
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    env:
      VITE_SUPABASE_URL: '${{ secrets.VITE_SUPABASE_URL }}'
      VITE_SUPABASE_ANON_KEY: '${{ secrets.VITE_SUPABASE_ANON_KEY }}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - run: npm install --legacy-peer-deps
      - run: npm run build

      - name: Build Linux App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          TAURI_SIGNING_PRIVATE_KEY: '${{ secrets.TAURI_SIGNING_PRIVATE_KEY_B64 }}'
        with:
          tagName: v__VERSION__
          releaseName: 'PharmaTRACK v__VERSION__'
          releaseDraft: true
          prerelease: false

      # Reads the real compiled Linux signature and injects it, along with the
      # Windows signature passed from job 1, into a valid updater manifest.
      - name: Generate Manual Manifest File
        env:
          APP_VER: ${{ needs.build-windows.outputs.version }}
          WIN_SIG: ${{ needs.build-windows.outputs.win_sig }}
          REPO: ${{ github.repository }}
        run: |
          # Pick exactly ONE .sig file (prefer .deb, fall back to AppImage).
          # Never cat multiple .sig files together — if both exist, concatenating
          # them merges their contents into one corrupted, invalid-base64 blob.
          LINUX_SIG_FILE=$(find src-tauri/target/release/bundle/deb -name "*.sig" 2>/dev/null | head -n 1)
          if [ -z "$LINUX_SIG_FILE" ]; then
            LINUX_SIG_FILE=$(find src-tauri/target/release/bundle/appimage -name "*.sig" 2>/dev/null | head -n 1)
          fi
          LINUX_SIG=$(cat "$LINUX_SIG_FILE" 2>/dev/null || echo "")

          if [ -z "$LINUX_SIG" ]; then
            echo "ERROR: No Linux .sig file found — updater signature would be empty." >&2
            exit 1
          fi

          cat << EOF > latest.json
          {
            "version": "$APP_VER",
            "notes": "PharmaTRACK update release v$APP_VER",
            "pub_date": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "platforms": {
              "windows-x86_64": {
                "signature": "$WIN_SIG",
                "url": "https://github.com/$REPO/releases/download/v$APP_VER/PharmaTRACK_${APP_VER}_x64_en-US.msi"
              },
              "linux-x86_64": {
                "signature": "$LINUX_SIG",
                "url": "https://github.com/$REPO/releases/download/v$APP_VER/PharmaTRACK_${APP_VER}_amd64.deb"
              }
            }
          }
          EOF

      # Android APK: release signing fails closed. Android updates only work when
      # every APK is signed by the SAME private certificate, so the keystore is
      # injected from secrets and is never committed to git.
      - name: Set up JDK for Android
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          [ -d "$SDK" ] || SDK="/usr/local/lib/android/sdk"
          find_sdkmanager() {
            for p in "$SDK/cmdline-tools/latest/bin/sdkmanager" \
                     "$SDK/cmdline-tools/bin/sdkmanager" \
                     "$SDK/tools/bin/sdkmanager"; do
              if [ -x "$p" ]; then printf '%s\n' "$p"; return 0; fi
            done
            return 1
          }
          if SDKMANAGER="$(find_sdkmanager)"; then
            echo "Using runner-provided Android SDK at $SDK"
          else
            echo "No cmdline-tools found — installing fresh Android SDK"
            SDK="$RUNNER_TEMP/android-sdk"
            mkdir -p "$SDK/cmdline-tools"
            curl -fsSL --retry 3 --connect-timeout 15 -o /tmp/cmdtools.zip \
              "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            unzip -q /tmp/cmdtools.zip -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/35.0.0" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" >/dev/null
          "$SDKMANAGER" --version

      - name: Prepare Android release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPECTED_ANDROID_CERT_SHA256: '8C:26:79:8C:42:90:06:99:12:21:46:69:C3:04:54:C8:44:71:99:96:E8:6F:EF:EE:98:49:94:6A:DB:C8:18:28'
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing Android signing secret::$name is empty or not configured."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error title=Android release signing incomplete::Set ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD before running the release workflow."
            exit 1
          fi

          mkdir -p android/app
          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n\t ' | base64 --decode > android/app/release-keystore.p12; then
            echo "::error title=Invalid ANDROID_KEYSTORE_BASE64::The keystore secret is not valid base64. Use: base64 -w 0 pharmatrack-release.p12 > pharmatrack-release.base64"
            exit 1
          fi
          if [ ! -s android/app/release-keystore.p12 ]; then
            echo "::error title=Empty Android keystore::ANDROID_KEYSTORE_BASE64 decoded to an empty file."
            exit 1
          fi

          if ! keytool -list -v \
            -storetype PKCS12 \
            -keystore android/app/release-keystore.p12 \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" > /tmp/pharmatrack-android-keystore.txt 2>&1; then
            echo "::error title=Android keystore could not be opened::Check ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD. The alias should be pharmatrack unless you generated a different one."
            sed 's/^/KEYSTORE: /' /tmp/pharmatrack-android-keystore.txt
            exit 1
          fi

          CERT_SHA256="$(sed -n 's/^.*SHA256: //p' /tmp/pharmatrack-android-keystore.txt | head -n 1 | tr -d '\r')"
          echo "Android release certificate SHA-256: $CERT_SHA256"
          if [ "$CERT_SHA256" != "$EXPECTED_ANDROID_CERT_SHA256" ]; then
            echo "::error title=Android certificate mismatch::The GitHub signing secret does not match public/.well-known/assetlinks.json. Expected $EXPECTED_ANDROID_CERT_SHA256 but got $CERT_SHA256."
            exit 1
          fi

      - name: Build Android release APK (signed)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PHARMA_ANDROID_SKIP_GRADLE_SIGNING: 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd android
          ./gradlew --version
          set +e
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/pharmatrack-android-gradle.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo "Android Gradle failure summary:"
            python3 - <<'PY' | sed 's/^/ANDROID_GRADLE_ROOT: /'
          from pathlib import Path
          lines = Path('/tmp/pharmatrack-android-gradle.log').read_text(errors='replace').splitlines()
          needles = ('e:', 'w:', 'FAILURE:', '* What went wrong:', '* Try:', '* Exception is:', 'Execution failed', 'Caused by:', '> ')
          picked = [line for line in lines if line.startswith(needles) or 'Execution failed' in line or 'Caused by:' in line]
          for line in (picked[-160:] or lines[-160:]):
              print(line)
          PY
            echo "Last 160 lines from the Android Gradle failure:"
            tail -n 160 /tmp/pharmatrack-android-gradle.log | sed 's/^/ANDROID_GRADLE: /'
            message="$(python3 -c "from pathlib import Path; lines=Path('/tmp/pharmatrack-android-gradle.log').read_text(errors='replace').splitlines(); needles=('e:', 'w:', 'FAILURE:', '* What went wrong:', 'Execution failed', 'Caused by:', '> '); picked=[line for line in lines if line.startswith(needles) or 'Execution failed' in line or 'Caused by:' in line]; text='\n'.join((picked or lines)[-60:]); print(text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))")"
            echo "::error title=Android Gradle build failed::$message"
            exit "$status"
          fi

          unsigned_apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          signed_apk="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$unsigned_apk" ]; then
            unsigned_apk="$signed_apk"
          fi
          if [ ! -f "$unsigned_apk" ]; then
            echo "::error title=Android unsigned APK missing::Gradle did not produce app-release-unsigned.apk or app-release.apk."
            find app/build/outputs/apk -maxdepth 5 -type f 2>/dev/null || true
            exit 1
          fi
          if [ "$unsigned_apk" = "$signed_apk" ]; then
            cp "$unsigned_apk" /tmp/pharmatrack-release-to-sign.apk
            unsigned_apk="/tmp/pharmatrack-release-to-sign.apk"
          fi

          rm -f "$signed_apk"
          sign_ok=0
          for candidate_name in ANDROID_KEY_PASSWORD ANDROID_KEYSTORE_PASSWORD; do
            keypass="${!candidate_name}"
            [ -n "$keypass" ] || continue
            echo "Signing release APK with apksigner using $candidate_name candidate."
            if apksigner sign \
              --ks app/release-keystore.p12 \
              --ks-type PKCS12 \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
              --key-pass "pass:$keypass" \
              --out "$signed_apk" \
              "$unsigned_apk" > /tmp/pharmatrack-apksigner.log 2>&1; then
              sign_ok=1
              break
            fi
            rm -f "$signed_apk"
            sed 's/^/APKSIGNER: /' /tmp/pharmatrack-apksigner.log
          done
          if [ "$sign_ok" -ne 1 ]; then
            echo "::error title=Android APK manual signing failed::apksigner could not sign with ANDROID_KEY_PASSWORD or ANDROID_KEYSTORE_PASSWORD. Check that the keystore password, key alias, and key password secrets match the uploaded keystore."
            exit 1
          fi
          if ! apksigner verify --print-certs "$signed_apk" >/tmp/pharmatrack-apksigner-verify.txt 2>&1; then
            sed 's/^/APKSIGNER_VERIFY: /' /tmp/pharmatrack-apksigner-verify.txt
            echo "::error title=Android APK signature verification failed::apksigner signed the APK but could not verify it."
            exit 1
          fi
          echo "Android release APK signed successfully with apksigner."

      - name: Upload Android Gradle failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-gradle-failure-log
          path: /tmp/pharmatrack-android-gradle.log
          if-no-files-found: ignore

      - name: Verify Android APK signature and version
        env:
          APP_VER: ${{ needs.build-windows.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::Release APK missing: $APK"
            exit 1
          fi
          apksigner verify --print-certs "$APK" > /tmp/pharmatrack-apk-certs.txt
          if grep -qi "CN=Android Debug" /tmp/pharmatrack-apk-certs.txt; then
            echo "::error::The Android APK is debug-signed. Refusing to publish it."
            exit 1
          fi
          BADGE_VERSION="$(aapt2 dump badging "$APK" | head -n1 | sed -n 's/.*versionName='\''\([^'\'']*\)'\''.*/\1/p')"
          if [ "$BADGE_VERSION" != "$APP_VER" ]; then
            echo "::error::APK versionName ($BADGE_VERSION) != release version ($APP_VER)."
            exit 1
          fi
          cp "$APK" "PharmaTRACK-$APP_VER.apk"
          echo "Android APK verified: release-signed and versionName $BADGE_VERSION"

      # Explicitly force GitHub to attach latest.json and the signed APK to the release.
      #
      # softprops/action-gh-release PATCHes the release before it uploads anything,
      # echoing the release's own raw target_commitish SHA back to GitHub. When the
      # tag already has an older published release (which happens as soon as a
      # version number is reused), that update is refused with
      # "Resource not accessible by integration" even though the job has
      # contents: write, and the whole release job fails after a successful build.
      # The GitHub CLI only touches the asset endpoint plus a minimal release
      # PATCH, so republishing an existing tag keeps working.
      - name: Force Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          APP_VER: ${{ needs.build-windows.outputs.version }}
          APK_NAME: PharmaTRACK-${{ needs.build-windows.outputs.version }}.apk
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v$APP_VER"

          for asset in latest.json "$APK_NAME"; do
            if [ ! -s "$asset" ]; then
              echo "::error title=Release asset missing::$asset was not produced by this run."
              exit 1
            fi
          done

          if gh release view "$TAG" --json tagName >/dev/null 2>&1; then
            echo "Reusing existing release $TAG."
          else
            echo "No release found for $TAG — creating it."
            gh release create "$TAG" \
              --title "PharmaTRACK $TAG" \
              --notes "PharmaTRACK update release $TAG" \
              --target "$COMMIT_SHA" \
              --draft
          fi

          # Asset uploads only need contents: write, so they succeed on brand new
          # drafts and on releases that already carry an older copy of the file.
          gh release upload "$TAG" latest.json "$APK_NAME" --clobber

          IS_DRAFT="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
          if [ "$IS_DRAFT" = "true" ]; then
            if ! gh release edit "$TAG" --draft=false --latest; then
              echo "Publishing with --latest failed; retrying without the latest flag."
              if ! gh release edit "$TAG" --draft=false; then
                echo "::error title=Release still a draft::$TAG kept its draft state, so the downloads stay hidden. Check that the workflow token may update releases for this tag."
                exit 1
              fi
              echo "::warning title=Release not marked latest::$TAG was published but could not be flagged as the latest release. The desktop updater reads releases/latest/download/latest.json."
            fi
          elif ! gh release edit "$TAG" --latest; then
            echo "::warning title=Release not marked latest::$TAG already exists and could not be flagged as the latest release. The desktop updater reads releases/latest/download/latest.json."
          fi

          gh release view "$TAG" --json assets --jq '.assets[].name' > /tmp/pharmatrack-release-assets.txt
          sed 's/^/RELEASE ASSET: /' /tmp/pharmatrack-release-assets.txt
          for asset in latest.json "$APK_NAME"; do
            if ! grep -Fxq "$asset" /tmp/pharmatrack-release-assets.txt; then
              echo "::error title=Release asset not attached::$asset is missing from release $TAG."
              exit 1
            fi
          done
          echo "Release $TAG published with latest.json and $APK_NAME."
