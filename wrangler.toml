# Cloudflare Workers + Static Assets + R2 foundation for PharmaTRACK.
#
# SUPABASE_ANON_KEY is intentionally not in this file. Set it as a Worker
# secret with `wrangler secret put SUPABASE_ANON_KEY --env <environment>`.
# It is publishable, but keeping deployment credentials out of Git prevents
# accidental coupling between source control and an environment.

name = "pharmatrack-api-local"
main = "cloudflare/worker/src/index.ts"
compatibility_date = "2026-09-25"
workers_dev = true

[vars]
ENVIRONMENT = "local"
SUPABASE_URL = "https://ltpwedxcvbejiywmwrwc.supabase.co"
CORS_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173"

[assets]
directory = "dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[r2_buckets]]
binding = "R2_OBJECTS"
bucket_name = "pharmatrack-objects-local"
preview_bucket_name = "pharmatrack-objects-local"

# Cloudflare's rate-limit binding is optional in local development. The Worker
# remains fail-closed on auth and authorization when this binding is absent.

[env.staging]
name = "pharmatrack-api-staging"
workers_dev = true

[env.staging.vars]
ENVIRONMENT = "staging"
SUPABASE_URL = "https://ltpwedxcvbejiywmwrwc.supabase.co"
# The Pages project is the canonical staging web origin. Keep this exact;
# do not use a wildcard.
CORS_ORIGINS = "https://pharmatrack-web-staging.pages.dev"

[env.staging.assets]
directory = "dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[env.staging.r2_buckets]]
binding = "R2_OBJECTS"
bucket_name = "pharmatrack-objects-staging"

[[env.staging.ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

[env.production]
name = "pharmatrack-api-production"
workers_dev = true

[env.production.vars]
ENVIRONMENT = "production"
SUPABASE_URL = "https://ltpwedxcvbejiywmwrwc.supabase.co"
# The Pages project is the canonical production web origin. Keep this exact;
# a missing or wildcard origin is not acceptable for private APIs.
CORS_ORIGINS = "https://pharmatrack-web.pages.dev"

[env.production.assets]
directory = "dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[env.production.r2_buckets]]
binding = "R2_OBJECTS"
bucket_name = "pharmatrack-objects-production"

[[env.production.ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 120, period = 60 }
